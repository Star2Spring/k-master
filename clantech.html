<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>클랜 기술 계산기</title>
<style>
  body {
    font-family: 'Malgun Gothic', sans-serif;
    background-color: #f4f5f7;
    margin: 0;
    padding: 20px;
    color: #333;
    -webkit-user-select: none;
    user-select: none;
  }
  .sticky-header {
    position: sticky;
    top: 0;
    background: #ffffff;
    padding: 15px 20px;
    border-radius: 12px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    margin-bottom: 25px;
    text-align: center;
    font-size: 1.2em;
    font-weight: bold;
    z-index: 100;
  }
  .highlight-give { color: #ff0000; font-size: 1.3em; }
  .highlight-potion { color: #2ecc71; font-size: 1.3em; }
  .highlight-progress { color: #3498db; font-size: 1.3em; }
  .added-info { font-size: 0.8em; color: #888; font-weight: normal; margin-top: 5px; }
  
  .category-section {
    background: #e9eaee;
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 30px;
  }
  .category-title {
    text-align: center;
    font-size: 1.1em;
    font-weight: 900;
    margin-bottom: 20px;
  }
  .grid-container {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px 10px;
  }
  .skill-node {
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
    -webkit-touch-callout: none;
  }
  .skill-icon {
    width: 65px;
    height: 65px;
    border-radius: 50%;
    border: 3px solid #222;
    background-color: #82a8d4;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    margin-bottom: 8px;
    transition: transform 0.1s;
    box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 13px;
    font-weight: bold;
    text-shadow: 1px 1px 2px rgba(255,255,255,0.8);
  }
  .skill-icon:active {
    transform: scale(0.95);
  }
  .skill-level {
    font-weight: 800;
    background: #fff;
    padding: 4px 12px;
    border-radius: 12px;
    border: 2px solid #222;
    font-size: 0.9em;
    transition: background-color 0.1s;
  }
  .skill-level:active {
    background-color: #ffcccc;
    transform: scale(0.95);
  }
  .max-level { color: #e74c3c; }
  /* 내 레벨(Base) 상태일 때 시각적 피드백 */
  .base-level { border-color: #999; color: #666; } 
</style>
</head>
<body>

<div class="sticky-header">
  추가 필요 기부: <span id="total-give" class="highlight-give">0</span> 개<br>
  추가 필요 녹색 물약: <span id="total-potion" class="highlight-potion">0</span> 개<br>
  최종 도달 진행도: <span id="total-progress" class="highlight-progress">0.00</span> %
  <div class="added-info" id="added-progress-info">(+0.00% 상승)</div>
</div>

<div id="skill-container"></div>

<script>
  const TOTAL_GAME_LEVELS = 1306; 

  // ⭐️ 데이터 설정 영역 ⭐️ (여기에 백업해둔 데이터를 넣으세요)
  // current에 적힌 숫자가 '내 현재 스펙(최소치)'이 됩니다.
  const skillsData = [

    { category: "전투력", id: "p11", name: "펫 체력", img: "pet_hp.png", current: 0, max: 20, cost: 608 },
    { category: "전투력", id: "p12", name: "탈것 피해", img: "tal_power.png", current: 0, max: 20, cost: 608 },
    { category: "전투력", id: "p13", name: "탈것 체력", img: "tal_hp.png", current: 0, max: 20, cost: 608 },

    { category: "알 타이머", id: "e1", name: "일반", img: "egg1.png", current: 0, max: 60, cost: 135 },

    { category: "알 타이머", id: "e3", name: "서사", img: "egg3.png", current: 0, max: 60, cost: 135 },
    { category: "알 타이머", id: "e4", name: "전설", img: "egg4.png", current: 0, max: 60, cost: 135 },
    { category: "알 타이머", id: "e5", name: "궁극", img: "egg5.png", current: 0, max: 60, cost: 135 },
    { category: "알 타이머", id: "e6", name: "신화", img: "egg6.png", current: 0, max: 60, cost: 135 },

    { category: "특수", id: "s1", name: "제련 망치수", img: "ham1.png", current: 0, max: 2, cost: 6080 },
    { category: "특수", id: "s2", name: "제련 속도", img: "ham2.png", current: 0, max: 20, cost: 608 },
    { category: "특수", id: "s3", name: "이동 속도", img: "speed.png", current: 0, max: 20, cost: 608 },
    { category: "특수", id: "s4", name: "공격 범위", img: "range.png", current: 0, max: 3, cost: 4056 },

    { category: "클랜 전쟁", id: "c1", name: "제련 포인트", img: "c1.png", current: 0, max: 10, cost: 243 },
    { category: "클랜 전쟁", id: "c2", name: "스킬 소환", img: "c2.png", current: 0, max: 10, cost: 243 },
    { category: "클랜 전쟁", id: "c3", name: "스킬 강화", img: "c3.png", current: 0, max: 10, cost: 243 },
    { category: "클랜 전쟁", id: "c4", name: "기술 트리", img: "c4.png", current: 0, max: 10, cost: 243 },
    { category: "클랜 전쟁", id: "c5", name: "대장간 강화", img: "c5.png", current: 0, max: 10, cost: 243 },
    { category: "클랜 전쟁", id: "c6", name: "던전 열쇠", img: "c6.png", current: 0, max: 10, cost: 243 },
    { category: "클랜 전쟁", id: "c7", name: "알 부화", img: "c7.png", current: 0, max: 10, cost: 243 },
    { category: "클랜 전쟁", id: "c8", name: "펫 합체", img: "c8.png", current: 0, max: 10, cost: 243 },
    { category: "클랜 전쟁", id: "c9", name: "탈것 소환", img: "c9.png", current: 0, max: 10, cost: 243 },
    { category: "클랜 전쟁", id: "c10", name: "1일차", img: "c10.png", current: 0, max: 10, cost: 405 },
    { category: "클랜 전쟁", id: "c11", name: "2일차", img: "c11.png", current: 0, max: 10, cost: 405 },
    { category: "클랜 전쟁", id: "c12", name: "3일차", img: "c12.png", current: 0, max: 10, cost: 405 },
    { category: "클랜 전쟁", id: "c13", name: "4일차", img: "c13.png", current: 0, max: 10, cost: 405 },
    { category: "클랜 전쟁", id: "c14", name: "5일차", img: "c14.png", current: 0, max: 10, cost: 405 },
    { category: "클랜 전쟁", id: "c15", name: "6일차", img: "c15.png", current: 0, max: 10, cost: 405 },
    { category: "클랜 전쟁", id: "c16", name: "클전 피해", img: "c16.png", current: 0, max: 100, cost: 246 },
    { category: "클랜 전쟁", id: "c17", name: "클전 체력", img: "c17.png", current: 0, max: 100, cost: 246 },
    { category: "클랜 전쟁", id: "c18", name: "클전 개인 보상", img: "c18.png", current: 0, max: 10, cost: 1622 },
    { category: "클랜 전쟁", id: "c19", name: "클전 승리 보상", img: "c19.png", current: 0, max: 10, cost: 1622 },
    { category: "클랜 전쟁", id: "c20", name: "클전 패배 보상", img: "c20.png", current: 0, max: 10, cost: 1622 },    

    { category: "클랜 임무", id: "m1", name: "임무 피해", img: "miss_power.png", current: 0, max: 20, cost: 304 },
    { category: "클랜 임무", id: "m2", name: "임무 체력", img: "miss_hp.png", current: 0, max: 20, cost: 304 },
    { category: "클랜 임무", id: "m3", name: "임무 보상", img: "miss_reword.png", current: 0, max: 10, cost: 1215 },

    { category: "던전", id: "d1", name: "해머 던전 피해", img: "ham_dun_power.png", current: 0, max: 10, cost: 973 },
    { category: "던전", id: "d2", name: "해머 던전 체력", img: "ham_dun_hp.png", current: 0, max: 10, cost: 973 },
    { category: "던전", id: "d3", name: "유령 던전 피해", img: "skill_dun_power.png", current: 0, max: 10, cost: 487 },
    { category: "던전", id: "d4", name: "유령 던전 체력", img: "skill_dun_hp.png", current: 0, max: 10, cost: 487 },
    { category: "던전", id: "d5", name: "침공 던전 피해", img: "egg_dun_power.png", current: 0, max: 10, cost: 487 },
    { category: "던전", id: "d6", name: "침공 던전 체력", img: "egg_dun_hp.png", current: 0, max: 10, cost: 487 },
    { category: "던전", id: "d7", name: "좀비 던전 피해", img: "zombie_dun_power.png", current: 0, max: 10, cost: 487 },  
    { category: "던전", id: "d8", name: "좀비 던전 체력", img: "zombie_dun_hp.png", current: 0, max: 10, cost: 487 },   
    
    { category: "클랜 녹즙", id: "g1", name: "임무 녹즙", img: "g1.png", current: 0, max: 20, cost: 608 },
    { category: "클랜 녹즙", id: "g2", name: "개인 보상 녹즙", img: "g2.png", current: 0, max: 20, cost: 608 },
    { category: "클랜 녹즙", id: "g3", name: "클전 승리 녹즙", img: "g3.png", current: 0, max: 20, cost: 608 },
    { category: "클랜 녹즙", id: "g4", name: "클전 패배 녹즙", img: "g4.png", current: 0, max: 20, cost: 608 },
    { category: "클랜 녹즙", id: "g5", name: "레이스 보상 증가", img: "g5.png", current: 0, max: 20, cost: 608 },  
    { category: "클랜 녹즙", id: "g6", name: "레이스 기부 증가", img: "g6.png", current: 0, max: 20, cost: 608 }  
  ];

  // 시스템 초기화: 스크립트가 실행될 때 current 값을 base(최소치)로 복사해둡니다.
  skillsData.forEach(skill => {
    skill.base = skill.current; 
  });

  const container = document.getElementById("skill-container");
  const categories = [...new Set(skillsData.map(s => s.category))];
  
  categories.forEach(cat => {
    const section = document.createElement("div");
    section.className = "category-section";
    
    const title = document.createElement("div");
    title.className = "category-title";
    title.innerText = cat;
    section.appendChild(title);
    
    const grid = document.createElement("div");
    grid.className = "grid-container";
    
    const catSkills = skillsData.filter(s => s.category === cat);
    
    catSkills.forEach(skill => {
      const node = document.createElement("div");
      node.className = "skill-node";
      
      const icon = document.createElement("div");
      icon.className = "skill-icon";
      if(skill.img) {
        icon.style.backgroundImage = `url('./${skill.img}')`;
        icon.style.color = "transparent";
        icon.innerText = skill.name;
      } else {
        icon.innerText = skill.name;
      }
      
      const levelLabel = document.createElement("div");
      levelLabel.className = "skill-level";
      levelLabel.id = `label-${skill.id}`;
      levelLabel.innerText = `${skill.current}/${skill.max}`;
      
      // 1. PC 우클릭 & 모바일 롱터치 시 -> 레벨 다운 (base 이하로는 안 내려감)
      node.addEventListener("contextmenu", (e) => {
        e.preventDefault();
        if (skill.current > skill.base) {
          skill.current--;
          updateUI();
        }
      });
      
      // 2. 동그라미 아이콘 터치 시 -> 레벨 업
      icon.addEventListener("click", (e) => {
        if (skill.current < skill.max) {
          skill.current++;
          updateUI();
        }
      });
      
      // 3. 아래쪽 숫자 라벨 터치 시 -> 레벨 다운 (base 이하로는 안 내려감)
      levelLabel.addEventListener("click", (e) => {
        e.stopPropagation();
        if (skill.current > skill.base) {
          skill.current--;
          updateUI();
        }
      });
      
      node.appendChild(icon);
      node.appendChild(levelLabel);
      grid.appendChild(node);
    });
    
    section.appendChild(grid);
    container.appendChild(section);
  });

  function updateUI() {
    let requiredPotion = 0; // '추가로' 필요한 물약
    let totalCurrentLevels = 0; // 최종 달성할 레벨 합계
    let addedLevels = 0; // 새로 올린 레벨 합계

    skillsData.forEach(skill => {
      const label = document.getElementById(`label-${skill.id}`);
      label.innerText = `${skill.current}/${skill.max}`;
      
      // 스타일 초기화
      label.classList.remove("max-level", "base-level");
      
      if(skill.current === skill.max) {
        label.classList.add("max-level"); // 만렙 시 빨간 글씨
      } else if(skill.current === skill.base) {
        label.classList.add("base-level"); // 최소치(내 스펙) 상태일 때 회색 테두리
      }

      // 새로 올린 레벨만큼만 물약 비용 계산
      let upLevels = skill.current - skill.base;
      requiredPotion += upLevels * skill.cost;
      addedLevels += upLevels;
      totalCurrentLevels += skill.current; 
    });

    let totalProgress = (totalCurrentLevels / TOTAL_GAME_LEVELS) * 100;
    let addedProgress = (addedLevels / TOTAL_GAME_LEVELS) * 100;

    document.getElementById("total-give").innerText = requiredPotion.toLocaleString();
    document.getElementById("total-potion").innerText = (requiredPotion*2).toLocaleString();
    document.getElementById("total-progress").innerText = totalProgress.toFixed(2); 
    document.getElementById("added-progress-info").innerText = `(+${addedProgress.toFixed(3)}% 상승)`;
  }

  // 첫 화면 렌더링
  updateUI();
</script>
</body>
</html>
