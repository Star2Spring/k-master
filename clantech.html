<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>클랜 기술 계산기</title>
<style>
  body {
    font-family: 'Malgun Gothic', sans-serif;
    background-color: #f4f5f7;
    margin: 0;
    padding: 20px;
    color: #333;
  }
  .sticky-header {
    position: sticky;
    top: 0;
    background: #ffffff;
    padding: 15px 20px;
    border-radius: 12px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    margin-bottom: 25px;
    text-align: center;
    font-size: 1.2em;
    font-weight: bold;
    z-index: 100;
  }
  .highlight-give { color: #ff0000; font-size: 1.3em; }
  .highlight-potion { color: #2ecc71; font-size: 1.3em; }
  .highlight-progress { color: #3498db; font-size: 1.3em; }
  
  .category-section {
    background: #e9eaee;
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 30px;
  }
  .category-title {
    text-align: center;
    font-size: 1.1em;
    font-weight: 900;
    margin-bottom: 20px;
  }
  .grid-container {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px 10px;
  }
  .skill-node {
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
    user-select: none;
  }
  
  /* 동그라미 안에 이미지가 들어가도록 수정된 부분 */
  .skill-icon {
    width: 65px;
    height: 65px;
    border-radius: 50%;
    border: 3px solid #222;
    background-color: #82a8d4; /* 이미지가 없을 때 기본 배경색 */
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    margin-bottom: 8px;
    transition: transform 0.1s;
    box-shadow: 0 2px 5px rgba(0,0,0,0.2);
  }
  .skill-icon:active {
    transform: scale(0.95);
  }
  
  .skill-level {
    font-weight: 800;
    background: #fff;
    padding: 2px 10px;
    border-radius: 12px;
    border: 2px solid #222;
    font-size: 0.9em;
  }
  .max-level { color: #e74c3c; }
</style>
</head>
<body>

<div class="sticky-header">
  총 필요 기부: <span id="total-give" class="highlight-potion">0</span> 개<br>
  총 필요 녹색 물약: <span id="total-potion" class="highlight-potion">0</span> 개<br>
  전체 진행도: <span id="total-progress" class="highlight-progress">0.00</span> %
</div>

<div id="skill-container"></div>

<script>
  const TOTAL_GAME_LEVELS = 1306; 

  // ⭐️ 데이터 설정 영역 ⭐️
  // img: "파일이름.png" (깃허브에 올릴 이미지 파일 이름과 똑같이 적어주세요!)
  const skillsData = [
    { category: "전투력", id: "p1", name: "무기", img: "weapon.png", current: 0, max: 20, cost: 304 },
    { category: "전투력", id: "p2", name: "헬멧", img: "helmet.png", current: 0, max: 20, cost: 304 },
    { category: "전투력", id: "p3", name: "갑옷", img: "armor.png", current: 0, max: 20, cost: 304 },
    { category: "전투력", id: "p4", name: "신발", img: "shoes.png", current: 0, max: 20, cost: 304 },
    { category: "전투력", id: "p5", name: "장갑", img: "glove.png", current: 0, max: 20, cost: 304 },
    { category: "전투력", id: "p6", name: "벨트", img: "belt.png", current: 0, max: 20, cost: 304 },
    { category: "전투력", id: "p7", name: "목걸이", img: "necklace.png", current: 0, max: 20, cost: 304 },
    { category: "전투력", id: "p8", name: "반지", img: "ring.png", current: 0, max: 20, cost: 304 }

     { category: "부랄타이머", id: "p8", name: "일반", img: "helmet.png", current: 0, max: 20, cost: 304 }
    // 아래에 추가하실 때도 img: "이미지이름.png" 형식으로 넣어주시면 됩니다.
  ];

  const container = document.getElementById("skill-container");
  const categories = [...new Set(skillsData.map(s => s.category))];
  
  categories.forEach(cat => {
    const section = document.createElement("div");
    section.className = "category-section";
    
    const title = document.createElement("div");
    title.className = "category-title";
    title.innerText = cat;
    section.appendChild(title);
    
    const grid = document.createElement("div");
    grid.className = "grid-container";
    
    const catSkills = skillsData.filter(s => s.category === cat);
    
    catSkills.forEach(skill => {
      const node = document.createElement("div");
      node.className = "skill-node";
      node.oncontextmenu = (e) => { e.preventDefault(); return false; };
      
      const icon = document.createElement("div");
      icon.className = "skill-icon";
      // ⭐️ 이미지를 배경으로 삽입하는 부분
      if(skill.img) {
        icon.style.backgroundImage = `url('./${skill.img}')`;
      } else {
        // 이미지가 없을 때 임시 텍스트 표시
        icon.innerText = skill.name; 
        icon.style.display = "flex";
        icon.style.justifyContent = "center";
        icon.style.alignItems = "center";
        icon.style.fontSize = "12px";
      }
      
      const levelLabel = document.createElement("div");
      levelLabel.className = "skill-level";
      levelLabel.id = `label-${skill.id}`;
      levelLabel.innerText = `${skill.current}/${skill.max}`;
      
      node.addEventListener("mousedown", (e) => {
        if (e.button === 0) {
          if (skill.current < skill.max) skill.current++;
        } else if (e.button === 2) {
          if (skill.current > 0) skill.current--;
        }
        updateUI();
      });
      
      node.appendChild(icon);
      node.appendChild(levelLabel);
      grid.appendChild(node);
    });
    
    section.appendChild(grid);
    container.appendChild(section);
  });

  function updateUI() {
    let totalPotion = 0;
    let totalCurrentLevels = 0;

    skillsData.forEach(skill => {
      const label = document.getElementById(`label-${skill.id}`);
      label.innerText = `${skill.current}/${skill.max}`;
      
      if(skill.current === skill.max) {
        label.classList.add("max-level");
      } else {
        label.classList.remove("max-level");
      }

      totalPotion += skill.current * skill.cost;
      totalCurrentLevels += skill.current; 
    });

    let totalProgress = (totalCurrentLevels / TOTAL_GAME_LEVELS) * 100;
    document.getElementById("total-give").innerText = totalPotion.toLocaleString();
    document.getElementById("total-potion").innerText = (totalPotion*2).toLocaleString();
    document.getElementById("total-progress").innerText = totalProgress.toFixed(2); 
  }

  updateUI();
</script>
</body>
</html>
