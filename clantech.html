<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>클랜 기술 계산기</title>
<style>
  body {
    font-family: 'Malgun Gothic', sans-serif;
    background-color: #f4f5f7;
    margin: 0;
    padding: 20px;
    color: #333;
    -webkit-user-select: none;
    user-select: none;
  }
  .sticky-header {
    position: sticky;
    top: 0;
    background: #ffffff;
    padding: 15px 20px;
    border-radius: 12px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    margin-bottom: 25px;
    text-align: center;
    font-size: 1.2em;
    font-weight: bold;
    z-index: 100;
  }
  .highlight-potion { color: #2ecc71; font-size: 1.3em; }
  .highlight-progress { color: #3498db; font-size: 1.3em; }
  .added-info { font-size: 0.8em; color: #888; font-weight: normal; margin-top: 5px; }
  
  .category-section {
    background: #e9eaee;
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 30px;
  }
  .category-title {
    text-align: center;
    font-size: 1.1em;
    font-weight: 900;
    margin-bottom: 20px;
  }
  .grid-container {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px 10px;
  }
  .skill-node {
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
    -webkit-touch-callout: none;
  }
  .skill-icon {
    width: 65px;
    height: 65px;
    border-radius: 50%;
    border: 3px solid #222;
    background-color: #82a8d4;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    margin-bottom: 8px;
    transition: transform 0.1s;
    box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 13px;
    font-weight: bold;
    text-shadow: 1px 1px 2px rgba(255,255,255,0.8);
  }
  .skill-icon:active {
    transform: scale(0.95);
  }
  .skill-level {
    font-weight: 800;
    background: #fff;
    padding: 4px 12px;
    border-radius: 12px;
    border: 2px solid #222;
    font-size: 0.9em;
    transition: background-color 0.1s;
  }
  .skill-level:active {
    background-color: #ffcccc;
    transform: scale(0.95);
  }
  .max-level { color: #e74c3c; }
  /* 내 레벨(Base) 상태일 때 시각적 피드백 */
  .base-level { border-color: #999; color: #666; } 
</style>
</head>
<body>

<div class="sticky-header">
  추가 필요 녹색 물약: <span id="total-potion" class="highlight-potion">0</span> 개<br>
  최종 도달 진행도: <span id="total-progress" class="highlight-progress">0.00</span> %
  <div class="added-info" id="added-progress-info">(+0.00% 상승)</div>
</div>

<div id="skill-container"></div>

<script>
  const TOTAL_GAME_LEVELS = 1306; 

  // ⭐️ 데이터 설정 영역 ⭐️ (여기에 백업해둔 데이터를 넣으세요)
  // current에 적힌 숫자가 '내 현재 스펙(최소치)'이 됩니다.
  const skillsData = [
    { category: "전투력", id: "p1", name: "무기", img: "weapon.png", current: 10, max: 20, cost: 304 }, // 예시로 10렙 기입
    { category: "전투력", id: "p2", name: "헬멧", img: "helmet.png", current: 5, max: 20, cost: 304 },  // 예시로 5렙 기입
    { category: "전투력", id: "p3", name: "갑옷", img: "armor.png", current: 0, max: 20, cost: 304 },
    { category: "전투력", id: "p4", name: "신발", img: "shoes.png", current: 0, max: 20, cost: 304 },
    { category: "전투력", id: "p5", name: "장갑", img: "glove.png", current: 20, max: 20, cost: 304 }, // 이미 만렙인 경우
    { category: "전투력", id: "p6", name: "벨트", img: "belt.png", current: 0, max: 20, cost: 304 },
    { category: "전투력", id: "p7", name: "목걸이", img: "necklace.png", current: 0, max: 20, cost: 304 },
    { category: "전투력", id: "p8", name: "반지", img: "ring.png", current: 0, max: 20, cost: 304 }
  ];

  // 시스템 초기화: 스크립트가 실행될 때 current 값을 base(최소치)로 복사해둡니다.
  skillsData.forEach(skill => {
    skill.base = skill.current; 
  });

  const container = document.getElementById("skill-container");
  const categories = [...new Set(skillsData.map(s => s.category))];
  
  categories.forEach(cat => {
    const section = document.createElement("div");
    section.className = "category-section";
    
    const title = document.createElement("div");
    title.className = "category-title";
    title.innerText = cat;
    section.appendChild(title);
    
    const grid = document.createElement("div");
    grid.className = "grid-container";
    
    const catSkills = skillsData.filter(s => s.category === cat);
    
    catSkills.forEach(skill => {
      const node = document.createElement("div");
      node.className = "skill-node";
      
      const icon = document.createElement("div");
      icon.className = "skill-icon";
      if(skill.img) {
        icon.style.backgroundImage = `url('./${skill.img}')`;
        icon.style.color = "transparent";
        icon.innerText = skill.name;
      } else {
        icon.innerText = skill.name;
      }
      
      const levelLabel = document.createElement("div");
      levelLabel.className = "skill-level";
      levelLabel.id = `label-${skill.id}`;
      levelLabel.innerText = `${skill.current}/${skill.max}`;
      
      // 1. PC 우클릭 & 모바일 롱터치 시 -> 레벨 다운 (base 이하로는 안 내려감)
      node.addEventListener("contextmenu", (e) => {
        e.preventDefault();
        if (skill.current > skill.base) {
          skill.current--;
          updateUI();
        }
      });
      
      // 2. 동그라미 아이콘 터치 시 -> 레벨 업
      icon.addEventListener("click", (e) => {
        if (skill.current < skill.max) {
          skill.current++;
          updateUI();
        }
      });
      
      // 3. 아래쪽 숫자 라벨 터치 시 -> 레벨 다운 (base 이하로는 안 내려감)
      levelLabel.addEventListener("click", (e) => {
        e.stopPropagation();
        if (skill.current > skill.base) {
          skill.current--;
          updateUI();
        }
      });
      
      node.appendChild(icon);
      node.appendChild(levelLabel);
      grid.appendChild(node);
    });
    
    section.appendChild(grid);
    container.appendChild(section);
  });

  function updateUI() {
    let requiredPotion = 0; // '추가로' 필요한 물약
    let totalCurrentLevels = 0; // 최종 달성할 레벨 합계
    let addedLevels = 0; // 새로 올린 레벨 합계

    skillsData.forEach(skill => {
      const label = document.getElementById(`label-${skill.id}`);
      label.innerText = `${skill.current}/${skill.max}`;
      
      // 스타일 초기화
      label.classList.remove("max-level", "base-level");
      
      if(skill.current === skill.max) {
        label.classList.add("max-level"); // 만렙 시 빨간 글씨
      } else if(skill.current === skill.base) {
        label.classList.add("base-level"); // 최소치(내 스펙) 상태일 때 회색 테두리
      }

      // 새로 올린 레벨만큼만 물약 비용 계산
      let upLevels = skill.current - skill.base;
      requiredPotion += upLevels * skill.cost;
      addedLevels += upLevels;
      totalCurrentLevels += skill.current; 
    });

    let totalProgress = (totalCurrentLevels / TOTAL_GAME_LEVELS) * 100;
    let addedProgress = (addedLevels / TOTAL_GAME_LEVELS) * 100;

    document.getElementById("total-potion").innerText = requiredPotion.toLocaleString();
    document.getElementById("total-progress").innerText = totalProgress.toFixed(2); 
    document.getElementById("added-progress-info").innerText = `(+${addedProgress.toFixed(3)}% 상승)`;
  }

  // 첫 화면 렌더링
  updateUI();
</script>
</body>
</html>
